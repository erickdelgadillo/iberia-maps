[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iberia-maps"
version = "0.1.0"
description = "Mapas de costa, batimetría y relieve a partir de coordenadas"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "matplotlib>=3.7,<4", "netCDF4>=1.6,<2", "rasterio>=1.5,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
iberia-maps = "iberia_maps.cli:main"

[tool.setuptools.packages.find]
include = ["iberia_maps*"]
